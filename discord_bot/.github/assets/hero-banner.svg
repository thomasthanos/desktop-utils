<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111214" />
      <stop offset="50%" stop-color="#1e1f22" />
      <stop offset="100%" stop-color="#2b2d31" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5865F2" />
      <stop offset="50%" stop-color="#57F287" />
      <stop offset="100%" stop-color="#FEE75C" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="800" height="200" rx="14" fill="url(#bg)" stroke="#3f4248" stroke-width="1.5" />
  
  <!-- Subtle accent lines in background -->
  <line x1="40" y1="40" x2="220" y2="40" stroke="#5865F2" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <line x1="580" y1="160" x2="760" y2="160" stroke="#57F287" stroke-width="2" stroke-linecap="round" opacity="0.5"/>

  <g filter="url(#glow)">
    <text x="400" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" text-anchor="middle" letter-spacing="2" fill="url(#titleGrad)">DISCORD BOT + DASHBOARD</text>
  </g>
  <text x="400" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#949ba4" text-anchor="middle" letter-spacing="2">MUSIC <tspan fill="#5865F2">•</tspan> LIVE TRANSCRIPTS <tspan fill="#57F287">•</tspan> WEB DASHBOARD <tspan fill="#FEE75C">•</tspan> 24/7 RADIO</text>
</svg>